kind = "web"
previewPath = "/"
title = "Neon Drift"
description = "A lightweight 3D endless neon driving arcade game playable in the browser on desktop and mobile, with swipe steering, touch controls, traffic obstacles, energy orb collection, escalating speed, pause, replay, and local best scores."
version = "1.0.0"
id = "artifacts/3d-game"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24982

[services.development]
run = "pnpm --filter @workspace/3d-game run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/3d-game", "run", "build" ]
serve = "static"
publicDir = "artifacts/3d-game/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24982"
BASE_PATH = "/"
